[project]
name = "multi-world-agent"
version = "0.1.1"
description = "MWA — Multi World Agent. Agents don't talk to each other; they observe the same world."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "MWA Contributors" },
]
keywords = [
    "multi-agent",
    "world-model",
    "knowledge-graph",
    "llm",
    "coordination",
    "agent",
    "mcp",
    "semantic-arbiter",
    "shared-state",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.6",
    "typing-extensions>=4.10",
]

[project.urls]
Homepage = "https://github.com/Trustydev212/MWA"
Repository = "https://github.com/Trustydev212/MWA"
Issues = "https://github.com/Trustydev212/MWA/issues"

[project.scripts]
# Installed when users do `pip install mwa[mcp]`.  The server only
# runs if `mcp` is available; the script checks and errors cleanly
# otherwise.
mwa-mcp = "mwa.mcp_server.__main__:main"

[project.optional-dependencies]
# Each LLM provider is its own optional extra so users only install what they need.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=0.3"]
ollama = ["httpx>=0.27"]
all-llm = [
    "anthropic>=0.40",
    "openai>=1.40",
    "google-genai>=0.3",
    "httpx>=0.27",
]

# MCP server (Model Context Protocol) for plugging into Claude Code,
# Cursor, Codex, and other MCP hosts.
mcp = ["mcp>=1.0"]

# Convenience kitchen-sink extra — everything but the dev tools.
all = [
    "anthropic>=0.40",
    "openai>=1.40",
    "google-genai>=0.3",
    "httpx>=0.27",
    "mcp>=1.0",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "anyio>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mwa"]

[tool.hatch.build.targets.sdist]
# Ship the harness maps, examples, and docs in the sdist so users
# who install from source or want to reference the OpenClaw harness
# don't have to clone the repo.
include = [
    "mwa/**/*.py",
    "mwa/py.typed",
    "harness_maps/*.json",
    "examples/**/*.py",
    "examples/**/*.md",
    "README.md",
    "ARCHITECTURE.md",
    "RESEARCH.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: tests that require external services (graph DB, LLM API)",
    "slow: tests that take more than ~1s",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # allow assert in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Optional LLM SDKs + MCP — installed only via the matching extra.  Without
# this override, mypy in a minimal dev env errors on their TYPE_CHECKING imports.
[[tool.mypy.overrides]]
module = [
    "anthropic",
    "anthropic.*",
    "openai",
    "openai.*",
    "httpx",
    "httpx.*",
    "mcp",
    "mcp.*",
]
ignore_missing_imports = true

# mwa.mcp_server.server wraps MCP SDK decorators (``@app.list_tools()``,
# ``@app.call_tool()``) which carry no type info from the mcp package.  The
# strict "untyped-decorator" check would flag every handler; relax just this
# module without loosening the rest of the project.
[[tool.mypy.overrides]]
module = "mwa.mcp_server.server"
disallow_untyped_decorators = false
disallow_untyped_calls = false

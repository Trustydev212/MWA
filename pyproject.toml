[project]
name = "soma"
version = "0.0.1"
description = "SOMA — Shared Observer Multi Agent. Agents don't talk to each other; they observe the same world."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SOMA Contributors" },
]
keywords = ["multi-agent", "world-model", "knowledge-graph", "llm", "coordination"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.6",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
# Each LLM provider is its own optional extra so users only install what they need.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=0.3"]
ollama = ["httpx>=0.27"]
all-llm = [
    "anthropic>=0.40",
    "openai>=1.40",
    "google-genai>=0.3",
    "httpx>=0.27",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "anyio>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soma"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: tests that require external services (graph DB, LLM API)",
    "slow: tests that take more than ~1s",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # allow assert in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Optional LLM SDKs — installed only via the matching extra.  Without this
# override, mypy in a minimal dev env errors on their TYPE_CHECKING imports.
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "openai", "openai.*", "httpx", "httpx.*"]
ignore_missing_imports = true
